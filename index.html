<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Calculadora de conversión USD a Bs, Bs a USD y USDT P2P."
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Calculadora BCV"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icon-192.png"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>Calculadora BCV</title>

</head>


<body>

    <main class="app">


        <!-- =================================
             ENCABEZADO
        ================================== -->

        <header class="header">

            <h1>
                Calculadora BCV
            </h1>

            <p>
                Conversión USD ↔ Bs
            </p>

        </header>


        <!-- =================================
             PESTAÑAS
        ================================== -->

        <nav
            class="calculator-tabs"
            aria-label="Calculadoras"
        >

            <button
                id="tab-bcv"
                class="calculator-tab active"
                type="button"
            >
                BCV
            </button>


            <button
                id="tab-usdt"
                class="calculator-tab"
                type="button"
            >
                USDT P2P
            </button>

        </nav>


        <!-- =================================
             TARJETA DE TASAS
        ================================== -->

        <section class="rate-card">


            <div class="rate-item">

                <span class="rate-label">
                    Tasa BCV
                </span>

                <strong id="bcv-rate">
                    Cargando...
                </strong>

            </div>


            <div class="divider"></div>


            <div class="rate-item">

                <span class="rate-label">
                    Tasa +0,5%
                </span>

                <strong id="adjusted-rate">
                    Cargando...
                </strong>

            </div>


            <p class="updated">

                Vigencia:
                <span id="last-update">
                    --
                </span>

            </p>

        </section>


        <!-- =================================
             CALCULADORA BCV
        ================================== -->

        <section
            id="bcv-calculator"
            class="converter"
        >


            <!-- USD / Bs -->

            <div class="conversion-buttons">

                <button
                    id="usd-to-bs"
                    class="conversion-button active"
                    type="button"
                >
                    USD → Bs
                </button>


                <button
                    id="bs-to-usd"
                    class="conversion-button"
                    type="button"
                >
                    Bs → USD
                </button>

            </div>


            <!-- MONTO -->

            <div class="input-section">

                <label
                    for="amount"
                    id="amount-label"
                >
                    Monto en USD
                </label>


                <div class="input-wrapper">

                    <span id="currency-symbol">
                        $
                    </span>


                    <input
                        id="amount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="any"
                        placeholder="0,00"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- RESULTADO -->

            <div class="result-card">

                <span class="result-label">
                    Resultado
                </span>


                <strong id="result">
                    0,00
                </strong>


                <span id="result-currency">
                    Bs
                </span>

            </div>


            <!-- ACTUALIZAR BCV -->

            <button
                id="refresh-rate"
                class="refresh-button"
                type="button"
            >
                Actualizar tasa BCV
            </button>


            <p
                id="status-message"
                class="status-message"
                aria-live="polite"
            ></p>


        </section>


        <!-- =================================
             CALCULADORA USDT P2P
        ================================== -->

        <section
            id="usdt-calculator"
            class="converter hidden"
        >


            <h2>
                USDT P2P
            </h2>


            <p
                class="status-message"
                style="margin-top: -6px; margin-bottom: 18px;"
            >
                Precio de referencia basado en ofertas P2P.
            </p>


            <!-- COMPRAR / VENDER -->

            <div class="conversion-buttons">


                <button
                    id="usdt-buy"
                    class="conversion-button active"
                    type="button"
                >
                    Comprar USDT
                </button>


                <button
                    id="usdt-sell"
                    class="conversion-button"
                    type="button"
                >
                    Vender USDT
                </button>


            </div>


            <!-- MONTO -->

            <div class="input-section">


                <label
                    for="usdt-amount"
                    id="usdt-amount-label"
                >
                    Monto en Bs
                </label>


                <div class="input-wrapper">


                    <span id="usdt-currency-symbol">
                        Bs
                    </span>


                    <input
                        id="usdt-amount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="any"
                        placeholder="0,00"
                        autocomplete="off"
                    >


                </div>


            </div>


            <!-- PRECIO P2P -->

            <div class="result-card">


                <span class="result-label">
                    Precio P2P
                </span>


                <strong id="usdt-price">
                    --
                </strong>


                <span>
                    Bs/USDT
                </span>


            </div>


            <!-- RESULTADO -->

            <div class="result-card">


                <span class="result-label">
                    Recibes aproximadamente
                </span>


                <strong id="usdt-result">
                    0,00
                </strong>


                <span id="usdt-result-currency">
                    USDT
                </span>


            </div>


            <!-- ACTUALIZAR P2P -->

            <button
                id="refresh-usdt"
                class="refresh-button"
                type="button"
            >
                Actualizar precio P2P
            </button>


            <p
                id="usdt-status-message"
                class="status-message"
                aria-live="polite"
            ></p>


        </section>


        <!-- =================================
             PIE DE PÁGINA
        ================================== -->

        <footer class="footer">

            <p>
                Tasa BCV + ajuste de 0,5%
            </p>

            <p>
                USDT P2P: precio de referencia
            </p>

        </footer>


    </main>


    <script src="./app.js"></script>

</body>

</html>
