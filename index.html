<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="Calculadora BCV y USDT P2P"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icon-192.png"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>Calculadora BCV</title>
</head>

<body>

    <main class="app">

        <!-- ================================
             ENCABEZADO
        ================================= -->

        <header class="header">

            <h1>Calculadora BCV</h1>

            <p>
                Conversión USD ↔ Bs
            </p>

        </header>


        <!-- ================================
             TABS
        ================================= -->

        <nav
            class="calculator-tabs"
            aria-label="Calculadoras"
        >

            <button
                id="tab-bcv"
                class="calculator-tab active"
                type="button"
            >
                BCV
            </button>

            <button
                id="tab-usdt"
                class="calculator-tab"
                type="button"
            >
                USDT P2P
            </button>

        </nav>


        <!-- ================================
             TASAS BCV
        ================================= -->

        <section class="rate-card">

            <div class="rate-item">

                <span>
                    Tasa BCV
                </span>

                <strong id="bcv-rate">
                    Cargando...
                </strong>

            </div>


            <div class="rate-divider"></div>


            <div class="rate-item">

                <span>
                    Tasa +0,5%
                </span>

                <strong id="adjusted-rate">
                    Cargando...
                </strong>

            </div>


            <div class="rate-update">

                Vigencia:
                <span id="last-update">
                    No disponible
                </span>

            </div>

        </section>


        <!-- ================================
             CALCULADORA BCV
        ================================= -->

        <section
            id="bcv-calculator"
            class="converter"
        >

            <div class="conversion-buttons">

                <button
                    id="usd-to-bs"
                    class="conversion-button active"
                    type="button"
                >
                    USD → Bs
                </button>

                <button
                    id="bs-to-usd"
                    class="conversion-button"
                    type="button"
                >
                    Bs → USD
                </button>

            </div>


            <div class="input-group">

                <label for="amount" id="amount-label">
                    Monto en USD
                </label>

                <div class="amount-input-wrapper">

                    <span
                        id="currency-symbol"
                        class="currency-symbol"
                    >
                        $
                    </span>

                    <input
                        id="amount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="any"
                        placeholder="0,00"
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="result-card">

                <span>
                    Resultado
                </span>

                <div class="result-value">

                    <strong id="result">
                        0,00
                    </strong>

                    <span id="result-currency">
                        Bs
                    </span>

                </div>

            </div>


            <button
                id="refresh-rate"
                class="refresh-button"
                type="button"
            >
                Actualizar tasa BCV
            </button>


            <p
                id="status-message"
                class="status-message"
                aria-live="polite"
            ></p>

        </section>


        <!-- ================================
             CALCULADORA USDT P2P
        ================================= -->

        <section
            id="usdt-calculator"
            class="converter hidden"
        >

            <div class="section-title">

                <h2>
                    USDT P2P
                </h2>

                <p>
                    Precio de referencia basado en ofertas P2P.
                </p>

            </div>


            <!-- COMPRA / VENTA -->

            <div class="conversion-buttons">

                <button
                    id="usdt-buy"
                    class="conversion-button active"
                    type="button"
                >
                    Comprar USDT
                </button>

                <button
                    id="usdt-sell"
                    class="conversion-button"
                    type="button"
                >
                    Vender USDT
                </button>

            </div>


            <!-- MONTO -->

            <div class="input-group">

                <label
                    for="usdt-amount"
                    id="usdt-amount-label"
                >
                    Monto en Bs
                </label>

                <div class="amount-input-wrapper">

                    <span
                        id="usdt-currency-symbol"
                        class="currency-symbol"
                    >
                        Bs
                    </span>

                    <input
                        id="usdt-amount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="any"
                        placeholder="0,00"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- PRECIO P2P -->

            <div class="result-card">

                <span>
                    Precio P2P
                </span>

                <div class="result-value">

                    <strong id="usdt-price">
                        --
                    </strong>

                    <span>
                        Bs/USDT
                    </span>

                </div>

            </div>


            <!-- RESULTADO -->

            <div class="result-card">

                <span>
                    Recibes aproximadamente
                </span>

                <div class="result-value">

                    <strong id="usdt-result">
                        0,00
                    </strong>

                    <span id="usdt-result-currency">
                        USDT
                    </span>

                </div>

            </div>


            <!-- ACTUALIZAR -->

            <button
                id="refresh-usdt"
                class="refresh-button"
                type="button"
            >
                Actualizar precio P2P
            </button>


            <p
                id="usdt-status-message"
                class="status-message"
                aria-live="polite"
            ></p>

        </section>


        <!-- ================================
             PIE
        ================================= -->

        <footer class="footer">

            <p>
                Tasa BCV + ajuste de 0,5%
            </p>

            <p>
                USDT P2P: precio de referencia
            </p>

        </footer>

    </main>


    <script src="./app.js"></script>

</body>
</html>
