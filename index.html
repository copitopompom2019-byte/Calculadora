<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Calculadora BCV y precio de referencia USDT P2P."
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Calculadora BCV"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icon-192.png"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <title>Calculadora BCV</title>
</head>

<body>

    <main class="app">

        <!-- ENCABEZADO -->
        <header class="header">
            <h1>Calculadora BCV</h1>
            <p>Conversión USD ↔ Bs</p>
        </header>


        <!-- PESTAÑAS -->
        <nav
            class="calculator-tabs"
            aria-label="Calculadoras"
        >

            <button
                id="tab-bcv"
                class="calculator-tab active"
                type="button"
            >
                BCV
            </button>

            <button
                id="tab-usdt"
                class="calculator-tab"
                type="button"
            >
                USDT P2P
            </button>

        </nav>


        <!-- TASAS -->
        <section class="rate-card">

            <div class="rates-row">

                <div class="rate-item">
                    <span class="rate-label">
                        Tasa BCV
                    </span>

                    <strong id="bcv-rate">
                        Cargando...
                    </strong>
                </div>


                <div class="rate-divider"></div>


                <div class="rate-item">
                    <span class="rate-label">
                        Tasa +0,5%
                    </span>

                    <strong id="adjusted-rate">
                        Cargando...
                    </strong>
                </div>

            </div>


            <div class="rate-bottom-divider"></div>


            <p class="updated">
                <span class="calendar-icon">▣</span>

                Vigencia:
                <span id="last-update">
                    --
                </span>
            </p>

        </section>


        <!-- ============================= -->
        <!-- CALCULADORA BCV -->
        <!-- ============================= -->

        <section
            id="bcv-calculator"
            class="converter"
        >

            <div class="conversion-buttons">

                <button
                    id="usd-to-bs"
                    class="conversion-button active"
                    type="button"
                >
                    USD → Bs
                </button>

                <button
                    id="bs-to-usd"
                    class="conversion-button"
                    type="button"
                >
                    Bs → USD
                </button>

            </div>


            <div class="input-section">

                <label
                    for="amount"
                    id="amount-label"
                >
                    Monto en USD
                </label>


                <div class="input-wrapper">

                    <span id="currency-symbol">
                        $
                    </span>

                    <input
                        id="amount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="any"
                        placeholder="0,00"
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="result-card">

                <div class="result-info">
                    <span class="result-label">
                        Resultado
                    </span>

                    <strong id="result">
                        0,00
                    </strong>
                </div>

                <span
                    id="result-currency"
                    class="result-currency"
                >
                    Bs
                </span>

            </div>


            <button
                id="refresh-rate"
                class="refresh-button"
                type="button"
            >
                ↻ &nbsp; Actualizar tasa BCV
            </button>
<button
    id="enable-notifications"
    class="refresh-button"
    type="button"
>
    🔔 Activar notificaciones
</button>

<p
    id="notification-status"
    class="status-message"
    aria-live="polite"
></p>

            <p
                id="status-message"
                class="status-message"
                aria-live="polite"
            ></p>

        </section>


        <!-- ============================= -->
        <!-- CALCULADORA USDT -->
        <!-- ============================= -->

        <section
            id="usdt-calculator"
            class="converter hidden"
        >

            <div class="section-heading">
                <h2>USDT P2P</h2>

                <p>
                    Precio de referencia basado en ofertas P2P.
                </p>
            </div>


            <div class="conversion-buttons">

                <button
                    id="usdt-buy"
                    class="conversion-button active"
                    type="button"
                >
                    Comprar USDT
                </button>

                <button
                    id="usdt-sell"
                    class="conversion-button"
                    type="button"
                >
                    Vender USDT
                </button>

            </div>


            <div class="input-section">

                <label
                    for="usdt-amount"
                    id="usdt-amount-label"
                >
                    Monto en Bs
                </label>


                <div class="input-wrapper">

                    <span id="usdt-currency-symbol">
                        Bs
                    </span>

                    <input
                        id="usdt-amount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="any"
                        placeholder="0,00"
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="result-card">

                <div class="result-info">

                    <span class="result-label">
                        Precio P2P
                    </span>

                    <strong id="usdt-price">
                        --
                    </strong>

                </div>

                <span class="result-currency">
                    Bs/USDT
                </span>

            </div>


            <div class="result-card">

                <div class="result-info">

                    <span class="result-label">
                        Recibes aproximadamente
                    </span>

                    <strong id="usdt-result">
                        0,00
                    </strong>

                </div>

                <span
                    id="usdt-result-currency"
                    class="result-currency"
                >
                    USDT
                </span>

            </div>


            <button
                id="refresh-usdt"
                class="refresh-button"
                type="button"
            >
                ↻ &nbsp; Actualizar precio P2P
            </button>


            <p
                id="usdt-status-message"
                class="status-message"
                aria-live="polite"
            ></p>

        </section>


        <!-- PIE -->
        <footer class="footer">

            <div></div>

            <p>
                Tasa BCV + ajuste de 0,5%
            </p>

            <p>
                USDT P2P: precio de referencia
            </p>

        </footer>

    </main>


    <script src="./app.js"></script>

</body>
</html>
